      // State: User

        const saved = localStorage.getItem('wejobs_user');
        return saved ? JSON.parse(saved) : {
          id: 'user-demo-1',
          fullName: 'Budi Santoso',
          email: 'budi.santoso@example.com',
          phone: '+62 812-3456-7890',
          address: 'Jakarta Selatan, DKI Jakarta',
          bio: 'Freelance writer & content creator berdedikasi dengan pengalaman lebih dari 3 tahun.',
          role: 'user', // user, admin, super_admin
          avatarType: 'builtin',
          builtinAvatarId: 'rabbit',
          balance: 145.50,
          pendingBalance: 42.00,
          totalEarned: 320.00
        };
      });

      // State: Tasks Catalog
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('wejobs_tasks');
        return saved ? JSON.parse(saved) : INITIAL_TASKS;
      });

      // State: User Assignments (My Tasks)
      const [assignments, setAssignments] = useState(() => {
        const saved = localStorage.getItem('wejobs_assignments');
        return saved ? JSON.parse(saved) : [
          {
            id: 'asg-1',
            taskId: 'task-1',
            taskTitle: 'Review & Ringkasan Bab Buku Non-Fiksi Bisnis Modern',
            category: 'Writing',
            payment: 25.00,
            status: 'in_progress', // in_progress, under_review, completed, revision_required
            assignedAt: new Date(Date.now() - 3600000 * 5).toISOString(),
            submissionNote: '',
            fileName: ''
          }
        ];
      });

      // State: Transactions
      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('wejobs_transactions');
        return saved ? JSON.parse(saved) : [
          {
            id: 'tx-1001',
            date: new Date(Date.now() - 86400000 * 2).toISOString(),
            type: 'Earning',
            description: 'Penyelesaian Tugas: Transkripsi Audio Podcast #42',
            status: 'Completed',
            amount: 30.00
          },
          {
            id: 'tx-1002',
            date: new Date(Date.now() - 86400000 * 5).toISOString(),
            type: 'Earning',
            description: 'Penyelesaian Tugas: Penerjemahan Naskah Ilmiah',
            status: 'Completed',
            amount: 45.50
          },
          {
            id: 'tx-1003',
            date: new Date(Date.now() - 86400000 * 10).toISOString(),
            type: 'Earning',
            description: 'Penyelesaian Tugas: Proofreading Modul Pelatihan',
            status: 'Completed',
            amount: 70.00
          }
        ];
      });

      // State: Notifications
      const [notifications, setNotifications] = useState(() => {
        const saved = localStorage.getItem('wejobs_notifs');
        return saved ? JSON.parse(saved) : [
          { id: 'notif-1', title: 'Selamat Datang di WEJOBS!', message: 'Mulai jelajahi pekerjaan mikro editorial dan klaim kompensasi USD pertama Anda.', read: false, time: 'Baru saja' },
          { id: 'notif-2', title: 'Tugas Siap Dikerjakan', message: 'Tugas "Review & Ringkasan Bab Buku" telah berhasil Anda klaim.', read: false, time: '5 jam lalu' }
        ];
      });

      // Toast Notification
      const [toast, setToast] = useState(null);
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      // Filter States
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [notifDropdownOpen, setNotifDropdownOpen] = useState(false);

      // Effect: Save to LocalStorage
      useEffect(() => {
        localStorage.setItem('wejobs_user', JSON.stringify(user));
      }, [user]);

      useEffect(() => {
        localStorage.setItem('wejobs_tasks', JSON.stringify(tasks));
      }, [tasks]);

      useEffect(() => {
        localStorage.setItem('wejobs_assignments', JSON.stringify(assignments));
      }, [assignments]);

      useEffect(() => {
        localStorage.setItem('wejobs_transactions', JSON.stringify(transactions));
      }, [transactions]);

      useEffect(() => {
        localStorage.setItem('wejobs_notifs', JSON.stringify(notifications));
      }, [notifications]);

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('wejobs_theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('wejobs_theme', 'light');
        }
      }, [darkMode]);

      // Handlers
      const handleClaimTask = (task) => {
        if (assignments.some(a => a.taskId === task.id && (a.status === 'in_progress' || a.status === 'under_review'))) {
          showToast('Anda sudah mengambil tugas ini dan sedang dalam proses.', 'error');
          return;
        }

        const newAssignment = {
          id: `asg-${Date.now()}`,
          taskId: task.id,
          taskTitle: task.title,
          category: task.category,
          payment: task.payment,
          status: 'in_progress',
          assignedAt: new Date().toISOString(),
          submissionNote: '',
          fileName: ''
        };

        setAssignments(prev => [newAssignment, ...prev]);
        setTasks(prev => prev.map(t => t.id === task.id ? { ...t, remainingSlots: Math.max(0, t.remainingSlots - 1) } : t));
        
        // Add Notification
        setNotifications(prev => [
          { id: `notif-${Date.now()}`, title: 'Tugas Berhasil Diklaim! 📝', message: `Anda telah mengambil "${task.title}". Segera selesaikan sebelum tenggat waktu.`, read: false, time: 'Baru saja' },
          ...prev
        ]);

        showToast('Tugas berhasil diklaim! Periksa halaman "Tugas Saya".');
        setTaskDetailOpen(false);
        setCurrentPage('mytasks');
      };

      const handleSubmitWork = (assignmentId, note, file) => {
        setAssignments(prev => prev.map(a => {
          if (a.id === assignmentId) {
            return {
              ...a,
              status: 'under_review',
              submissionNote: note,
              fileName: file ? file.name : 'dokumen_naskah_revisi.docx',
              submittedAt: new Date().toISOString()
            };
          }
          return a;
        }));

        setNotifications(prev => [
          { id: `notif-${Date.now()}`, title: 'Hasil Kerja Terkirim 📤', message: 'Naskah Anda sedang ditinjau oleh tim kurator. Saldo akan otomatis bertambah setelah disetujui.', read: false, time: 'Baru saja' },
          ...prev
        ]);

        showToast('Hasil kerja berhasil dikirim untuk peninjauan kurator.');
      };

      const handleAdminReview = (assignmentId, action, reason = '') => {
        const target = assignments.find(a => a.id === assignmentId);
        if (!target) return;

        if (action === 'accept') {
          setAssignments(prev => prev.map(a => a.id === assignmentId ? { ...a, status: 'completed' } : a));
          setUser(prev => ({
            ...prev,
            balance: prev.balance + target.payment,
            totalEarned: prev.totalEarned + target.payment
          }));
          setTransactions(prev => [
            {
              id: `tx-${Date.now()}`,
              date: new Date().toISOString(),
              type: 'Earning',
              description: `Penyelesaian Tugas: ${target.taskTitle}`,
              status: 'Completed',
              amount: target.payment
            },
            ...prev
          ]);
          setNotifications(prev => [
            { id: `notif-${Date.now()}`, title: 'Tugas Diterima! +$' + target.payment.toFixed(2) + ' USD 🎉', message: `Hasil kerja "${target.taskTitle}" telah disetujui. Dana telah masuk ke saldo Anda.`, read: false, time: 'Baru saja' },
            ...prev
          ]);
          showToast(`Tugas disetujui! Saldo +$${target.payment.toFixed(2)} USD.`);
        } else if (action === 'revision') {
          setAssignments(prev => prev.map(a => a.id === assignmentId ? { ...a, status: 'revision_required', revisionFeedback: reason || 'Mohon lengkapi bagian kesimpulan.' } : a));
          setNotifications(prev => [
            { id: `notif-${Date.now()}`, title: 'Permintaan Revisi Naskah ⚠️', message: `Kurator meminta perbaikan pada "${target.taskTitle}": ${reason || 'Periksa instruksi tambahan.'}`, read: false, time: 'Baru saja' },
            ...prev
          ]);
          showToast('Permintaan revisi telah dikirim ke freelancer.', 'error');
        }
      };

      const handleWithdrawal = (amount, method, details) => {
        if (amount < 100) {
          showToast('Batas minimal penarikan adalah $100.00 USD.', 'error');
          return;
        }
        if (user.balance < amount) {
          showToast('Saldo Anda tidak mencukupi untuk penarikan ini.', 'error');
          return;
        }

        setUser(prev => ({ ...prev, balance: prev.balance - amount }));
        setTransactions(prev => [
          {
            id: `tx-${Date.now()}`,
            date: new Date().toISOString(),
            type: 'Withdrawal',
            description: `Penarikan Dana via ${method} (${details})`,
            status: 'Processing',
            amount: -amount
          },
          ...prev
        ]);
        setNotifications(prev => [
          { id: `notif-${Date.now()}`, title: 'Permintaan Penarikan Diproses 🏦', message: `Penarikan sebesar $${amount.toFixed(2)} USD via ${method} sedang diproses dalam 1-2 hari kerja.`, read: false, time: 'Baru saja' },
          ...prev
        ]);
        showToast(`Penarikan $${amount.toFixed(2)} USD berhasil diajukan!`);
      };

      // Filtered Catalog
      const filteredTasks = tasks.filter(t => {
        if (selectedCategory !== 'All' && t.category !== selectedCategory) return false;
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          return t.title.toLowerCase().includes(q) || t.description.toLowerCase().includes(q) || t.category.toLowerCase().includes(q);
        }
        return true;
      });

      const unreadNotifCount = notifications.filter(n => !n.read).length;

      return (
        <div className="min-h-screen flex flex-col justify-between">

              toast.type === 'error' ? 'bg-rose-600 text-white' : 'bg-neutral-900 text-white dark:bg-white dark:text-neutral-900'
            }`}>
              <span>{toast.type === 'error' ? '⚠️' : '✅'}</span>
              <span>{toast.message}</span>
            </div>

                  Explore Jobs

                </button>

                  Panel Admin

                <button

              {/* Actions: Theme Toggle, Notifications, Profile */}
              <div className="flex items-center gap-2.5">

                  onClick={() => setDarkMode(!darkMode)}

                >
                  {darkMode ? '☀️' : '🌙'}

                  <div className="flex items-center justify-between">
                    <h2 className="text-lg font-bold text-neutral-900 dark:text-white">Buku Besar Transaksi (Ledger)</h2>
                    <span className="text-xs text-neutral-400">{transactions.length} mutasi</span>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="border-b border-neutral-200 dark:border-neutral-800 text-neutral-400 uppercase text-[10px]">
                        <tr>
                          <th className="py-2.5 px-2">Tanggal</th>
                          <th className="py-2.5 px-2">ID Mutasi</th>
                          <th className="py-2.5 px-2">Tipe</th>
                          <th className="py-2.5 px-2">Keterangan</th>
                          <th className="py-2.5 px-2 text-right">Jumlah (USD)</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-neutral-100 dark:divide-neutral-800">
                        {transactions.map(tx => (
                          <tr key={tx.id} className="hover:bg-neutral-50 dark:hover:bg-neutral-800/30">
                            <td className="py-3 px-2 text-neutral-500 whitespace-nowrap">{new Date(tx.date).toLocaleDateString('id-ID')}</td>
                            <td className="py-3 px-2 font-mono text-[11px] text-neutral-400">{tx.id}</td>
                            <td className="py-3 px-2 font-bold text-neutral-700 dark:text-neutral-300">{tx.type}</td>
                            <td className="py-3 px-2 text-neutral-600 dark:text-neutral-400 max-w-xs truncate">{tx.description}</td>
                            <td className={`py-3 px-2 text-right font-black ${tx.amount >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}`}>
                              {tx.amount >= 0 ? '+' : ''}${Math.abs(tx.amount).toFixed(2)}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* PAGE: PROFILE SETTINGS */}
            {currentPage === 'profile' && (
              <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-8">
                <div>
                  <h1 className="text-3xl font-black text-neutral-900 dark:text-white">Pengaturan Profil Pengguna</h1>
                  <p className="text-xs text-neutral-500">Sesuaikan informasi kontak, biodata, dan avatar karakter profil Anda.</p>
                </div>

                <div className="p-6 sm:p-8 rounded-3xl bg-white dark:bg-[#1e1d1a] border border-neutral-200 dark:border-neutral-800 shadow-xs space-y-6">
                  {/* Avatar Selector */}
                  <div className="space-y-3">
                    <label className="text-xs font-bold text-neutral-700 dark:text-neutral-300">Pilih Avatar Karakter:</label>
                    <div className="grid grid-cols-3 sm:grid-cols-6 gap-3">
                      {AVATARS.map(av => (
                        <button
                          key={av.id}
                          type="button"
                          onClick={() => setUser(prev => ({ ...prev, avatarType: 'builtin', builtinAvatarId: av.id, customAvatarUrl: null }))}
                          className={`p-3 rounded-2xl flex flex-col items-center gap-1.5 border transition-all ${
                            user.avatarType === 'builtin' && user.builtinAvatarId === av.id
                              ? 'border-orange-500 bg-orange-50 dark:bg-orange-950/40 ring-2 ring-orange-500/20'
                              : 'border-neutral-200 dark:border-neutral-700 hover:bg-neutral-50 dark:hover:bg-neutral-800'
                          }`}
                        >
                          <span className="text-3xl">{av.emoji}</span>
                          <span className="text-[10px] font-bold text-neutral-700 dark:text-neutral-300">{av.name}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Form Inputs */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div className="space-y-1">
                      <label className="text-xs font-bold text-neutral-700 dark:text-neutral-300">Nama Lengkap:</label>
                      <input
                        type="text"
                        value={user.fullName}
                        onChange={e => setUser({ ...user, fullName: e.target.value })}
                        className="w-full p-2.5 rounded-xl border border-neutral-200 dark:border-neutral-800 bg-neutral-50 dark:bg-neutral-900 text-xs text-neutral-900 dark:text-white"
                      />
                    </div>
                    <div className="space-y-1">
                      <label className="text-xs font-bold text-neutral-700 dark:text-neutral-300">Alamat Email:</label>
                      <input
                        type="email"
                        value={user.email}
                        disabled
                        className="w-full p-2.5 rounded-xl border border-neutral-200 dark:border-neutral-800 bg-neutral-100 dark:bg-neutral-800 text-xs text-neutral-500 cursor-not-allowed"
                      />
                    </div>
                    <div className="space-y-1">
                      <label className="text-xs font-bold text-neutral-700 dark:text-neutral-300">No. WhatsApp / HP:</label>
                      <input
                        type="text"
                        value={user.phone}
                        onChange={e => setUser({ ...user, phone: e.target.value })}
                        className="w-full p-2.5 rounded-xl border border-neutral-200 dark:border-neutral-800 bg-neutral-50 dark:bg-neutral-900 text-xs text-neutral-900 dark:text-white"
                      />
                    </div>
                    <div className="space-y-1">
                      <label className="text-xs font-bold text-neutral-700 dark:text-neutral-300">Domisili / Kota:</label>
                      <input
                        type="text"
                        value={user.address}
                        onChange={e => setUser({ ...user, address: e.target.value })}
                        className="w-full p-2.5 rounded-xl border border-neutral-200 dark:border-neutral-800 bg-neutral-50 dark:bg-neutral-900 text-xs text-neutral-900 dark:text-white"
                      />
                    </div>
                  </div>

                  <div className="space-y-1">
                    <label className="text-xs font-bold text-neutral-700 dark:text-neutral-300">Bio Singkat:</label>
                    <textarea
                      rows="3"
                      value={user.bio}
                      onChange={e => setUser({ ...user, bio: e.target.value })}
                      className="w-full p-2.5 rounded-xl border border-neutral-200 dark:border-neutral-800 bg-neutral-50 dark:bg-neutral-900 text-xs text-neutral-900 dark:text-white"
                    />
                  </div>

                  <button
                    onClick={() => showToast('Semua pengaturan profil berhasil disimpan permanen! ✔️')}
                    className="w-full py-3 rounded-2xl bg-orange-600 hover:bg-orange-700 text-white font-bold text-xs shadow-md"
                  >
                    Simpan Semua Pengaturan Profil
                  </button>
                </div>
              </div>
            )}

            {/* PAGE: ADMIN DASHBOARD */}
            {currentPage === 'admin' && (
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-8">
                <div className="flex items-center justify-between">
                  <div>
                    <h1 className="text-3xl font-black text-neutral-900 dark:text-white">Panel Kurator & Admin</h1>
                    <p className="text-xs text-neutral-500">Tinjau penyerahan naskah, setujui pembayaran saldo, dan kelola pekerjaan.</p>
                  </div>
                  <span className="px-3 py-1 rounded-xl bg-orange-100 text-orange-800 dark:bg-orange-950 dark:text-orange-300 text-xs font-bold">
                    Super Admin Mode
                  </span>
                </div>

                {/* Submissions Review Queue */}
                <div className="p-6 rounded-3xl bg-white dark:bg-[#1e1d1a] border border-neutral-200 dark:border-neutral-800 shadow-xs space-y-4">
                  <h2 className="text-lg font-bold text-neutral-900 dark:text-white">Antrean Peninjauan Naskah (Review Queue)</h2>
                  
                  {assignments.filter(a => a.status === 'under_review').length === 0 ? (
                    <p className="text-xs text-neutral-400 py-6 text-center">Tidak ada naskah yang menunggu peninjauan saat ini.</p>
                  ) : (
                    <div className="space-y-3">
                      {assignments.filter(a => a.status === 'under_review').map(asg => (
                        <div key={asg.id} className="p-4 rounded-2xl border border-neutral-200 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-900 space-y-3">
                          <div className="flex items-center justify-between">
                            <div>
                              <p className="font-bold text-neutral-900 dark:text-white text-sm">{asg.taskTitle}</p>
                              <p className="text-xs text-neutral-400">Berkas: {asg.fileName || 'dokumen_naskah.docx'}</p>
                              {asg.submissionNote && <p className="text-xs text-neutral-600 dark:text-neutral-300 italic mt-1">"{asg.submissionNote}"</p>}
                            </div>
                            <span className="text-lg font-black text-emerald-600 dark:text-emerald-400">+${asg.payment.toFixed(2)} USD</span>
                          </div>
                          <div className="flex items-center gap-2 pt-2 border-t border-neutral-200 dark:border-neutral-800">
                            <button
                              onClick={() => handleAdminReview(asg.id, 'accept')}
                              className="px-4 py-1.5 rounded-xl bg-emerald-600 text-white font-bold text-xs hover:bg-emerald-700"
                            >
                              Terima & Saldo Cair ✔️
                            </button>
                            <button
                              onClick={() => {
                                const reason = prompt('Masukkan alasan permintaan revisi:', 'Mohon perbaiki format sitasi dan kesimpulan.');
                                if (reason) handleAdminReview(asg.id, 'revision', reason);
                              }}
                              className="px-4 py-1.5 rounded-xl bg-amber-600 text-white font-bold text-xs hover:bg-amber-700"
                            >
                              Minta Revisi ⚠️
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* PAGE: FAQ */}
            {currentPage === 'faq' && (
              <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-8">
                <div>
                  <h1 className="text-3xl font-black text-neutral-900 dark:text-white">Frequently Asked Questions (FAQ)</h1>
                  <p className="text-xs text-neutral-500">Pertanyaan umum seputar pengerjaan tugas, kompensasi, dan aturan penarikan dana.</p>
                </div>

                <div className="space-y-4">
                  {FAQS.map((faq, idx) => (
                    <div key={idx} className="p-6 rounded-3xl bg-white dark:bg-[#1e1d1a] border border-neutral-200 dark:border-neutral-800 shadow-xs space-y-2">
                      <h3 className="font-bold text-neutral-900 dark:text-white text-base">❓ {faq.q}</h3>
                      <p className="text-xs text-neutral-600 dark:text-neutral-400 leading-relaxed">{faq.a}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* TASK DETAIL MODAL */}
          {taskDetailOpen && selectedTask && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="w-full max-w-xl rounded-3xl bg-white dark:bg-[#1e1d1a] border border-neutral-200 dark:border-neutral-800 shadow-2xl p-6 sm:p-8 space-y-6 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-neutral-100 dark:border-neutral-800 pb-4">
                  <span className="px-2.5 py-1 rounded-lg bg-orange-50 dark:bg-orange-950 text-orange-600 dark:text-orange-400 text-xs font-bold">
                    {selectedTask.category} • {selectedTask.subtype}
                  </span>
                  <button
                    onClick={() => setTaskDetailOpen(false)}
                    className="text-neutral-400 hover:text-neutral-600 dark:hover:text-white text-lg font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-2">
                  <h2 className="text-2xl font-black text-neutral-900 dark:text-white">{selectedTask.title}</h2>
                  <div className="flex items-center gap-3 text-xs">
                    <span className="text-emerald-600 dark:text-emerald-400 font-black text-lg">${selectedTask.payment.toFixed(2)} USD</span>
                    <span className="text-neutral-400">• Tenggat {selectedTask.deadlineHours} Jam</span>
                    <span className="text-neutral-400">• Sisa {selectedTask.remainingSlots} Slot</span>
                  </div>
                </div>

                <div className="space-y-3 text-xs text-neutral-600 dark:text-neutral-400">
                  <p className="font-bold text-neutral-900 dark:text-white">Deskripsi Pekerjaan:</p>
                  <p>{selectedTask.description}</p>
                  
                  <p className="font-bold text-neutral-900 dark:text-white pt-2">Instruksi Pengerjaan:</p>
                  <ul className="list-disc list-inside space-y-1">
                    {selectedTask.instructions.map((inst, i) => (
                      <li key={i}>{inst}</li>
                    ))}
                  </ul>
                </div>

                <div className="pt-4 border-t border-neutral-100 dark:border-neutral-800 flex items-center justify-end gap-3">
                  <button
                    onClick={() => setTaskDetailOpen(false)}
                    className="px-4 py-2 rounded-xl text-xs font-bold text-neutral-500 hover:bg-neutral-100 dark:hover:bg-neutral-800"
                  >
                    Tutup
                  </button>
                  <button
                    onClick={() => handleClaimTask(selectedTask)}
                    className="px-6 py-2.5 rounded-xl bg-orange-600 hover:bg-orange-700 text-white font-bold text-xs shadow-md shadow-orange-500/20"
                  >
                    Klaim Tugas Ini Sekarang
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-neutral-200/80 dark:border-neutral-800 bg-white dark:bg-[#171614] py-8 text-center text-xs text-neutral-500 space-y-2">
            <p className="font-bold text-neutral-900 dark:text-white">WEJOBS Global Freelance Platform — Single File Edition</p>
            <p>100% Standalone • Kompatibel dengan semua browser modern tanpa server tambahan.</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
